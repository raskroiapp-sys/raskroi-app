<!DOCTYPE html>
<html lang="ka" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ჭკვიანი რასკროი - Smart Raskroi AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans Georgian', sans-serif; -webkit-tap-highlight-color: transparent; transition: background-color 0.3s ease; }
    
    /* მუსონური ნეონის ციალის და შუქების მოძრავი ეფექტი */
    @keyframes auroraWave {
      0% { border-color: #10b981; box-shadow: 0 0 25px rgba(16, 185, 129, 0.4), inset 0 0 15px rgba(16, 185, 129, 0.2); }
      50% { border-color: #3b82f6; box-shadow: 0 0 35px rgba(59, 130, 246, 0.5), inset 0 0 20px rgba(59, 130, 246, 0.3); }
      100% { border-color: #10b981; box-shadow: 0 0 25px rgba(16, 185, 129, 0.4), inset 0 0 15px rgba(16, 185, 129, 0.2); }
    }

    .aurora-container {
      animation: auroraWave 6s infinite ease-in-out;
      border: 2px solid #10b981;
    }

    .aurora-logo-ring {
      animation: auroraWave 4s infinite ease-in-out;
      border: 2px solid #10b981;
    }

    .dynamic-input {
      border: 2px solid #ef4444 !important;
      transition: all 0.2s ease;
    }
    .dynamic-input.filled {
      border: 2px solid #10b981 !important;
      background-color: rgba(16, 185, 129, 0.05);
    }
  </style>
</head>
<body class="bg-slate-950 dark:bg-slate-950 bg-slate-100 text-slate-800 dark:text-slate-100 min-h-screen flex justify-center items-start p-0 sm:p-4">

  <!-- მობილურის ეკრანის კონტეინერი -->
  <div id="mainAppWrapper" class="w-full max-w-md bg-[#0D1322] min-h-screen sm:min-h-[844px] shadow-2xl flex flex-col justify-between sm:rounded-3xl overflow-hidden aurora-container transition-colors duration-300">
    
    <!-- ზედა ჰედერი -->
    <header class="p-5 pt-8 border-b border-slate-800 dark:border-slate-800 border-slate-200 flex items-center justify-between">
      <div>
        <span class="text-[11px] tracking-wider uppercase font-extrabold bg-emerald-950/40 text-emerald-400 px-2.5 py-1 rounded-md border border-emerald-800/50">Smart Raskroi AI</span>
        
        <!-- ზუსტი სათაურები -->
        <h1 id="pageTitle" class="text-2xl font-black tracking-tight mt-2 text-[#10b981]">ზომების შეტანა</h1>
        <p id="pageSubTitle" class="text-[11px] text-slate-400 font-medium mt-0.5">შეკვეთის მიცემის ფორმა / ზომების შეტანის მეთოდები</p>
      </div>
      
      <div class="flex items-center gap-2.5">
        <!-- ლოგო მუსონური შუქის ციალით -->
        <div class="w-11 h-11 rounded-2xl overflow-hidden aurora-logo-ring bg-slate-900 flex items-center justify-center shadow-md">
          <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=100&auto=format&fit=crop&q=60" alt="Logo" class="w-full h-full object-cover">
        </div>
        <!-- თემის გადამრთველი ღილაკი (მთვარე/მზე) -->
        <button onclick="toggleTheme()" class="w-10 h-10 rounded-xl bg-slate-800 dark:bg-slate-800 bg-slate-100 border border-slate-700 dark:border-slate-700 border-slate-200 flex items-center justify-center text-lg shadow-sm hover:scale-105 transition-transform" title="თემის შეცვლა">
          <span id="themeIcon">☀️</span>
        </button>
      </div>
    </header>

    <!-- მთავარი სამუშაო სივრცე -->
    <main class="p-5 flex-1 space-y-4 flex flex-col justify-center">

      <!-- ეტაპი 1: საამქრო, მასალა და ნარჩენები -->
      <div id="step1Selection" class="space-y-3.5">
        
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1.5">1. საამქრო / კომპანია (სავალდებულო)</label>
          <input type="text" id="factoryInput" placeholder="მაგ: შპს შავნაბადა, ltb..." list="factoryList" oninput="validateInput(this)" class="w-full p-3 bg-slate-900 dark:bg-slate-900 bg-slate-50 text-white dark:text-white text-slate-900 rounded-2xl text-sm font-bold outline-none dynamic-input">
          <datalist id="factoryList">
            <option value="შპს შავნაბადა (ორთაჭალა)">
            <option value="LTB (ელითბი)">
            <option value="ჯეოლამი">
            <option value="კავკასიის ლამინატი">
          </datalist>
        </div>

        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1.5">2. მასალის ფორმატი (<span class="text-[#10b981]">მილიმეტრებში - მმ</span>)</label>
          <select id="materialSelect" onchange="checkCustomMaterial(this)" class="w-full p-3 bg-slate-900 dark:bg-slate-900 bg-slate-50 text-white dark:text-white text-slate-900 border border-slate-800 rounded-2xl text-sm font-bold outline-none focus:border-[#10b981] mb-2">
            <option value="3660x2010">თურქული ლამინატი (3660 × 2010 მმ)</option>
            <option value="2800x2090">ავსტრიული ლამინატი (2800 × 2090 მმ)</option>
            <option value="2800x1220">MDF - მდფ (2800 × 1220 მმ)</option>
            <option value="2800x2090hdf">HDF - დევეპე (2800 × 2090 მმ)</option>
            <option value="custom">✏️ სხვა (საკუთარი ზომის მითითება)</option>
          </select>

          <div id="customMaterialBox" class="hidden grid grid-cols-2 gap-2">
            <input type="number" id="customWidth" placeholder="სიგრძე (მმ)" class="p-3 bg-slate-900 dark:bg-slate-900 bg-slate-50 text-white dark:text-white text-slate-900 border border-slate-800 rounded-xl text-xs font-bold outline-none">
            <input type="number" id="customHeight" placeholder="სიგანე (მმ)" class="p-3 bg-slate-900 dark:bg-slate-900 bg-slate-50 text-white dark:text-white text-slate-900 border border-slate-800 rounded-xl text-xs font-bold outline-none">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1.5">კრონკი (სისქე)</label>
            <select id="edgeSelect" class="w-full p-3 bg-slate-900 dark:bg-slate-900 bg-slate-50 text-white dark:text-white text-slate-900 border border-slate-800 rounded-2xl text-sm font-bold outline-none focus:border-[#10b981]">
              <option value="1mm">1 მმ</option>
              <option value="2mm">2 მმ</option>
              <option value="double">ორმაგი</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1.5">ცეხის ნარჩენი</label>
            <select id="scrapToggle" onchange="toggleScrapInput(this)" class="w-full p-3 bg-slate-900 dark:bg-slate-900 bg-slate-50 text-white dark:text-white text-slate-900 border border-slate-800 rounded-2xl text-sm font-bold outline-none focus:border-[#10b981]">
              <option value="no">არ მაქვს</option>
              <option value="yes">მაქვს ნარჩენი</option>
            </select>
          </div>
        </div>

        <div id="scrapBox" class="hidden p-3 bg-emerald-950/20 border border-emerald-900/50 rounded-2xl space-y-2">
          <label class="block text-[11px] font-bold text-emerald-300">მიუთითეთ ნარჩენი პანელის ზომები (მმ):</label>
          <div class="grid grid-cols-2 gap-2">
            <input type="text" placeholder="მაგ: 1000 x 500" class="p-2.5 bg-slate-900 text-white border border-slate-800 rounded-xl text-xs outline-none font-bold">
            <input type="text" placeholder="რაოდენობა (ც)" class="p-2.5 bg-slate-900 text-white border border-slate-800 rounded-xl text-xs outline-none font-bold">
          </div>
        </div>

        <button onclick="proceedToInputMethods()" class="w-full py-3.5 bg-gradient-to-r from-emerald-600 to-teal-600 text-white font-black rounded-2xl text-sm shadow-lg transition-all active:scale-98 mt-2">
          შემდეგი ➔ ზომების შეტანა
        </button>
      </div>

      <!-- ეტაპი 2: ზომების შეტანის მეთოდები -->
      <div id="step2Methods" class="hidden space-y-3">
        <div class="p-3 bg-emerald-950/30 border border-emerald-800/50 rounded-2xl mb-1 flex items-center justify-between text-xs">
          <span id="summaryParams" class="font-bold text-emerald-300">პარამეტრები...</span>
          <button onclick="backToStep1()" class="text-slate-400 underline font-bold">← უკან</button>
        </div>

        <button onclick="openOrderFinalizer()" class="w-full p-4 bg-[#131B31] border-2 border-slate-800 hover:border-[#10b981] rounded-2xl shadow-sm flex items-center gap-4 text-left transition-all active:scale-98">
          <div class="w-12 h-12 bg-slate-900 text-emerald-400 rounded-xl flex items-center justify-center text-2xl">📸</div>
          <div>
            <h5 class="font-extrabold text-sm text-white">ფოტოს სკანირება / ატვირთვა</h5>
            <p class="text-xs text-slate-400">ხელნაწერი ფურცლის ავტომატური დამუშავება</p>
          </div>
        </button>

        <button onclick="openOrderFinalizer()" class="w-full p-4 bg-[#131B31] border-2 border-slate-800 hover:border-[#10b981] rounded-2xl shadow-sm flex items-center gap-4 text-left transition-all active:scale-98">
          <div class="w-12 h-12 bg-slate-900 text-emerald-400 rounded-xl flex items-center justify-center text-2xl">🎙️</div>
          <div>
            <h5 class="font-extrabold text-sm text-white">ხმოვანი კარნახი</h5>
            <p class="text-xs text-slate-400">უკარნახეთ ზომები მიკროფონით</p>
          </div>
        </button>

        <button onclick="openOrderFinalizer()" class="w-full p-4 bg-[#131B31] border-2 border-slate-800 hover:border-[#10b981] rounded-2xl shadow-sm flex items-center gap-4 text-left transition-all active:scale-98">
          <div class="w-12 h-12 bg-slate-900 text-emerald-400 rounded-xl flex items-center justify-center text-2xl">⌨️</div>
          <div>
            <h5 class="font-extrabold text-sm text-white">ხელით შეყვანა (ცხრილი)</h5>
            <p class="text-xs text-slate-400">დეტალების ზომები მილიმეტრებში</p>
          </div>
        </button>

        <button onclick="backToStep1()" class="w-full py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-black rounded-xl transition-all">
          ← მთავარ პარამეტრებში დაბრუნება
        </button>
      </div>

      <!-- ეტაპი 3: შეკვეთის გაგზავნა -->
      <div id="step3Finalize" class="hidden space-y-3">
        <div class="p-3 bg-emerald-950/30 border border-emerald-800/50 rounded-2xl text-xs">
          <h4 class="font-black text-emerald-400 mb-1">📋 შეკვეთის გაგზავნა საამქროში</h4>
          <p class="text-slate-300">მიუთითეთ სიის კოდი და ლამინატის ფირმა/ფერი.</p>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-400 mb-1">სიის სახელი / კოდი (სავალდებულო)</label>
          <input type="text" id="orderCode" placeholder="მაგ: კარადა #1 (SK-305)" oninput="validateInput(this)" class="w-full p-3 bg-slate-900 text-white rounded-xl text-sm outline-none font-bold dynamic-input">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-400 mb-1">ლამინატის ფირმა და კოდი (ფერი)</label>
          <input type="text" id="materialCode" placeholder="მაგ: Egger - ჰამადა თეთრი W1000" class="w-full p-3 bg-slate-900 text-white border border-slate-800 rounded-xl text-sm outline-none focus:border-[#10b981]">
        </div>

        <button onclick="submitOrder()" class="w-full py-4 bg-emerald-600 hover:bg-emerald-500 text-white font-black rounded-2xl text-sm shadow-lg transition-all active:scale-98 mt-2">
          🚀 შეკვეთის გაგზავნა საამქროში
        </button>
        <button onclick="backToStep2()" class="w-full py-2.5 bg-slate-800 text-slate-300 text-xs font-black rounded-xl transition-all">
          ← ზომების არჩევაზე დაბრუნება
        </button>
      </div>

    </main>

    <!-- ქვედა ნავიგაცია -->
    <nav class="bg-[#0D1322] dark:bg-[#0D1322] bg-white border-t border-slate-800 dark:border-slate-800 border-slate-200 p-3 px-6 flex justify-around items-center shadow-sm">
      <button class="flex flex-col items-center text-[#10b981] font-bold text-xs gap-1">
        <span class="text-xl">➕</span>
        <span>შექმნა</span>
      </button>
      <button class="flex flex-col items-center text-slate-500 font-bold text-xs gap-1">
        <span class="text-xl">📋</span>
        <span>არქივი</span>
      </button>
      <button class="flex flex-col items-center text-slate-500 font-bold text-xs gap-1">
        <span class="text-xl">⚙️</span>
        <span>პარამეტრები</span>
      </button>
    </nav>

  </div>

  <script>
    function toggleTheme() {
      const html = document.documentElement;
      const icon = document.getElementById('themeIcon');
      const wrapper = document.getElementById('mainAppWrapper');
      
      if (html.classList.contains('dark')) {
        html.classList.remove('dark');
        html.classList.add('light');
        wrapper.classList.remove('bg-[#0D1322]');
        wrapper.classList.add('bg-white');
        icon.innerText = '🌙';
      } else {
        html.classList.remove('light');
        html.classList.add('dark');
        wrapper.classList.remove('bg-white');
        wrapper.classList.add('bg-[#0D1322]');
        icon.innerText = '☀️';
      }
    }

    function validateInput(input) {
      if (input.value.trim().length > 0) {
        input.classList.add('filled');
      } else {
        input.classList.remove('filled');
      }
    }

    function checkCustomMaterial(select) {
      const box = document.getElementById('customMaterialBox');
      if(select.value === 'custom') {
        box.classList.remove('hidden');
      } else {
        box.classList.add('hidden');
      }
    }

    function toggleScrapInput(select) {
      const box = document.getElementById('scrapBox');
      if(select.value === 'yes') {
        box.classList.remove('hidden');
      } else {
        box.classList.add('hidden');
      }
    }

    function proceedToInputMethods() {
      const factory = document.getElementById('factoryInput').value;
      if(!factory.trim()) {
        alert('გთხოვთ მიუთითოთ საამქრო / კომპანია!');
        document.getElementById('factoryInput').focus();
        return;
      }

      const materialSelect = document.getElementById('materialSelect');
      let materialText = materialSelect.options[materialSelect.selectedIndex].text;
      
      if(materialSelect.value === 'custom') {
        const w = document.getElementById('customWidth').value || '0';
        const h = document.getElementById('customHeight').value || '0';
        materialText = `საკუთარი ზომა: ${w}x${h} მმ`;
      }
      
      document.getElementById('step1Selection').classList.add('hidden');
      document.getElementById('step2Methods').classList.remove('hidden');
      
      document.getElementById('pageTitle').innerText = 'ზომების შეტანა';
      document.getElementById('pageSubTitle').innerText = 'შეკვეთის მიცემის ფორმა / ზომების შეტანის მეთოდები';
      document.getElementById('summaryParams').innerText = `${factory} | ${materialText}`;
    }

    function openOrderFinalizer() {
      document.getElementById('step2Methods').classList.add('hidden');
      document.getElementById('step3Finalize').classList.remove('hidden');
      document.getElementById('pageTitle').innerText = 'შეკვეთის გაგზავნა';
      document.getElementById('pageSubTitle').innerText = 'მიუთითეთ სიის კოდი და ფირმა';
    }

    function backToStep1() {
      document.getElementById('step2Methods').classList.add('hidden');
      document.getElementById('step3Finalize').classList.add('hidden');
      document.getElementById('step1Selection').classList.remove('hidden');
      document.getElementById('pageTitle').innerText = 'ზომების შეტანა';
      document.getElementById('pageSubTitle').innerText = 'შეკვეთის მიცემის ფორმა / ზომების შეტანის მეთოდები';
    }

    function backToStep2() {
      document.getElementById('step3Finalize').classList.add('hidden');
      document.getElementById('step2Methods').classList.remove('hidden');
      document.getElementById('pageTitle').innerText = 'ზომების შეტანა';
      document.getElementById('pageSubTitle').innerText = 'შეკვეთის მიცემის ფორმა / ზომების შეტანის მეთოდები';
    }

    function submitOrder() {
      const code = document.getElementById('orderCode').value;
      if(!code.trim()) {
        alert('გთხოვთ მიუთითოთ სიის სახელი ან კოდი!');
        document.getElementById('orderCode').focus();
        return;
      }
      alert('შეკვეთა წარმატებით გაიგზავნა საამქროში! კოდი: ' + code);
    }
  </script>
</body>
</html>
