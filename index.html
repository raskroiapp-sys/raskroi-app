
<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ჭკვიანი რასკროი - Smart Raskroi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans Georgian', sans-serif; -webkit-tap-highlight-color: transparent; }
    
    /* ელეგანტური ნეონ-გრადიენტული ხაზები ღია ფონისთვის */
    .light-neon-card {
      background: linear-gradient(135deg, #ffffff, #f8fafc);
      box-shadow: 0 10px 25px -5px rgba(168, 85, 247, 0.08), 0 8px 10px -6px rgba(59, 130, 246, 0.05);
      border: 2px solid #e2e8f0;
      transition: all 0.2s ease;
    }
    .light-neon-card:hover {
      border-color: #a855f7;
      transform: translateY(-2px);
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex justify-center items-start p-0 sm:p-4">

  <!-- მობილურის ეკრანის კონტეინერი -->
  <div class="w-full max-w-md bg-white min-h-screen sm:min-h-[844px] shadow-2xl flex flex-col justify-between sm:rounded-3xl overflow-hidden border border-slate-200">
    
    <!-- ზედა ჰედერი -->
    <header class="bg-white text-slate-900 p-5 pt-8 border-b border-slate-100 flex items-center justify-between">
      <div>
        <span class="text-[11px] tracking-wider uppercase font-extrabold bg-purple-50 text-purple-600 px-2.5 py-1 rounded-md border border-purple-100">Smart Raskroi AI</span>
        <h1 id="pageTitle" class="text-2xl font-black tracking-tight mt-2 text-slate-900">აირჩიეთ რეჟიმი</h1>
      </div>
      
      <!-- ლოგო / უკან დაბრუნების ღილაკი -->
      <div id="headerAction" class="flex items-center gap-2">
        <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-purple-500 via-pink-500 to-blue-500 p-0.5 shadow-md flex items-center justify-center">
          <div class="w-full h-full bg-white rounded-[14px] flex items-center justify-center font-black text-transparent bg-clip-text bg-gradient-to-r from-purple-600 to-blue-600 text-sm">
            AI
          </div>
        </div>
      </div>
    </header>

    <!-- მთავარი სამუშაო სივრცე -->
    <main id="mainContainer" class="p-5 flex-1 space-y-5 flex flex-col justify-center">

      <!-- მთავარი მენიუ: რეჟიმების არჩევანი -->
      <div id="modeSelection" class="space-y-4">
        <!-- ბარათი 1: ხელოსანი / საამქრო -->
        <div onclick="openWorkshopMode()" class="group p-5 light-neon-card rounded-3xl cursor-pointer relative overflow-hidden active:scale-98">
          <div class="absolute top-0 right-0 bg-gradient-to-l from-purple-600 to-pink-500 text-white font-black text-[10px] px-3.5 py-1 rounded-bl-xl uppercase tracking-wider shadow-sm">
            ოსტატებისთვის
          </div>
          <div class="flex items-center gap-4">
            <div class="w-14 h-14 bg-purple-50 text-purple-600 rounded-2xl flex items-center justify-center text-3xl group-hover:scale-110 transition-transform border border-purple-100">
              🔨
            </div>
            <div>
              <h3 class="text-lg font-black text-slate-900">საამქროს რეჟიმი</h3>
              <p class="text-xs text-slate-500 mt-1">სწრაფი ზომები, ფოტო სკანირება და ხმოვანი კარნახი</p>
            </div>
          </div>
        </div>

        <!-- ბარათი 2: ბიზნესი / ოფისი -->
        <div onclick="openBusinessMode()" class="group p-5 light-neon-card rounded-3xl cursor-pointer relative overflow-hidden active:scale-98">
          <div class="absolute top-0 right-0 bg-gradient-to-l from-blue-600 to-emerald-500 text-white font-black text-[10px] px-3.5 py-1 rounded-bl-xl uppercase tracking-wider shadow-sm">
            ლიცენზირებული
          </div>
          <div class="flex items-center gap-4">
            <div class="w-14 h-14 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center text-3xl group-hover:scale-110 transition-transform border border-blue-100">
              📊
            </div>
            <div>
              <h3 class="text-lg font-black text-slate-900">ბიზნესი / ოფისი</h3>
              <p class="text-xs text-slate-500 mt-1">შეკვეთების არქივი, სტატუსები და ხარჯთაღრიცხვა</p>
            </div>
          </div>
        </div>
      </div>

      <!-- საამქროს შიდა პანელი (თავიდან დამალულია, იხსნება საამქროს რეჟიმზე მიჭერისას) -->
      <div id="workshopView" class="hidden space-y-4">
        <div class="p-4 bg-purple-50 border border-purple-200 rounded-2xl flex items-center justify-between">
          <div>
            <span class="text-[10px] uppercase font-bold text-purple-600 tracking-wider">აქტიური რეჟიმი</span>
            <h4 class="text-sm font-black text-slate-900">საამქრო: აირჩიეთ შეტანის მეთოდი</h4>
          </div>
          <span class="text-2xl">🔨</span>
        </div>

        <!-- 3 მეთოდის ღილაკები -->
        <button onclick="alert('ფოტოს სკანირების კამერა ირთვება...')" class="w-full p-4 bg-white border-2 border-slate-200 hover:border-purple-500 rounded-2xl shadow-sm flex items-center gap-4 text-left transition-all active:scale-98">
          <div class="w-12 h-12 bg-purple-100 text-purple-600 rounded-xl flex items-center justify-center text-2xl">📸</div>
          <div>
            <h5 class="font-extrabold text-sm text-slate-900">ფოტოს გადაღება / სკანირება</h5>
            <p class="text-xs text-slate-500">ხელნაწერი ფურცლის ავტომატური ამოცნობა</p>
          </div>
        </button>

        <button onclick="alert('ხმოვანი კარნახი მზადდება...')" class="w-full p-4 bg-white border-2 border-slate-200 hover:border-blue-500 rounded-2xl shadow-sm flex items-center gap-4 text-left transition-all active:scale-98">
          <div class="w-12 h-12 bg-blue-100 text-blue-600 rounded-xl flex items-center justify-center text-2xl">🎙️</div>
          <div>
            <h5 class="font-extrabold text-sm text-slate-900">ხმოვანი კარნახი</h5>
            <p class="text-xs text-slate-500">უკარნახეთ ზომები მიკროფონით</p>
          </div>
        </button>

        <button onclick="alert('ხელით შესაყვანი ცხრილი იხსნება...')" class="w-full p-4 bg-white border-2 border-slate-200 hover:border-emerald-500 rounded-2xl shadow-sm flex items-center gap-4 text-left transition-all active:scale-98">
          <div class="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-xl flex items-center justify-center text-2xl">⌨️</div>
          <div>
            <h5 class="font-extrabold text-sm text-slate-900">ხელით შეყვანა (ცხრილი)</h5>
            <p class="text-xs text-slate-500">სანტიმეტრების მილიმეტრებში გადაყვანით</p>
          </div>
        </button>
      </div>

    </main>

    <!-- ქვედა ნავიგაცია -->
    <nav class="bg-white border-t border-slate-100 p-3 px-6 flex justify-around items-center shadow-sm">
      <button onclick="goHome()" class="flex flex-col items-center text-purple-600 font-bold text-xs gap-1">
        <span class="text-xl">➕</span>
        <span>შექმნა</span>
      </button>
      <button class="flex flex-col items-center text-slate-400 hover:text-slate-600 font-bold text-xs gap-1">
        <span class="text-xl">📋</span>
        <span>არქივი</span>
      </button>
      <button class="flex flex-col items-center text-slate-400 hover:text-slate-600 font-bold text-xs gap-1">
        <span class="text-xl">⚙️</span>
        <span>პარამეტრები</span>
      </button>
    </nav>

  </div>

  <script>
    function openWorkshopMode() {
      document.getElementById('modeSelection').classList.add('hidden');
      document.getElementById('workshopView').classList.remove('hidden');
      document.getElementById('pageTitle').innerText = 'საამქროს რეჟიმი';
      
      // ვამატებთ უკან დაბრუნების ღილაკს ჰედერში
      document.getElementById('headerAction').innerHTML = `
        <button onclick="goHome()" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-xl border border-slate-200">
          ← უკან
        </button>
      `;
    }

    function openBusinessMode() {
      alert('ბიზნეს რეჟიმი: მოწმდება აქტიური სესია და ლიცენზია...');
    }

    function goHome() {
      document.getElementById('workshopView').classList.add('hidden');
      document.getElementById('modeSelection').classList.remove('hidden');
      document.getElementById('pageTitle').innerText = 'აირჩიეთ რეჟიმი';
      document.getElementById('headerAction').innerHTML = `
        <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-purple-500 via-pink-500 to-blue-500 p-0.5 shadow-md flex items-center justify-center">
          <div class="w-full h-full bg-white rounded-[14px] flex items-center justify-center font-black text-transparent bg-clip-text bg-gradient-to-r from-purple-600 to-blue-600 text-sm">
            AI
          </div>
        </div>
      `;
    }
  </script>
</body>
</html>
