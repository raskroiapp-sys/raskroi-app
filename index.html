<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Smart Raskroi AI</title>
<link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2880/2880722.png">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#030511;--bg2:#070C1F;--side:#070C1F;--card:#070C1F;--hover:#131B33;
--bd:rgba(110,140,200,.28);--bd-blue:rgba(255,138,61,.7);
--t1:#F4F7FF;--t2:#A8B8D8;--t3:#7185AC;
--cyan:#8FB4FF;--blue:#2272FF;--purple:#8B3DFF;--ok:#00F0B5;--warn:#FFBE55;
--g1:linear-gradient(100deg,#FF9A4D 0%,#FF8A3D 45%,#F2552E 100%);
--gv:linear-gradient(135deg,#FFA64D 0%,#FF8A3D 50%,#F2552E 100%);
--gp:linear-gradient(145deg,rgba(18,26,45,.95),rgba(7,12,31,.98))}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:'Noto Sans Georgian',system-ui,-apple-system,sans-serif;color:var(--t1);
background:radial-gradient(ellipse at 85% 0,rgba(40,90,200,.28),transparent 42%),radial-gradient(ellipse at 0 100%,rgba(255,138,61,.14),transparent 40%),var(--bg);
background-attachment:fixed;overflow-x:hidden}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.panel{background:var(--gp);border:1px solid var(--bd);border-radius:18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 12px 32px rgba(0,0,0,.35);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.sub{background:rgba(3,8,24,.9);border:1px solid var(--bd);border-radius:14px;transition:.25s}
.sub:hover{background:var(--hover);border-color:var(--bd-blue);box-shadow:0 0 24px rgba(255,138,61,.18)}
.grad{background:var(--g1);background-size:200% 200%;animation:aur 16s ease-in-out infinite}
@keyframes aur{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:999px;font-weight:600;font-size:14px;min-height:44px;color:#fff;box-shadow:0 0 22px rgba(255,138,61,.3)}
.muted{color:var(--t3);font-size:12px}.sec{color:var(--t2)}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.side{background:var(--side);border-right:1px solid var(--bd);padding:20px 16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.nav{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;color:var(--t2);font-size:14px;text-align:left;width:100%;transition:.2s}
.nav:hover{background:rgba(13,35,66,.7);color:#fff}
.nav.on{color:#fff;background:var(--g1);background-size:200% 200%;animation:aur 16s ease-in-out infinite;box-shadow:var(--glow,0 0 24px rgba(255,138,61,.3))}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px}
.logo b{background:var(--g1);-webkit-background-clip:text;background-clip:text;color:transparent}
.hex{width:34px;height:34px;border-radius:10px;background:var(--gv);display:grid;place-items:center;box-shadow:0 0 18px rgba(255,138,61,.5)}
.main{padding:18px 24px 40px;min-width:0}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px}
.stack{display:flex;flex-direction:column;gap:18px;min-width:0}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.h{font-size:16px;font-weight:600}
.link{color:var(--cyan);font-size:12px;display:inline-flex;gap:4px;align-items:center;min-height:32px}
.pcards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pc{padding:14px;text-align:left;width:100%}
.thumb{width:48px;height:56px;border-radius:6px;background:#e9edf5;display:grid;place-items:center}
.thumb svg{stroke:#51607e;width:36px;height:42px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;font-size:12px;border:1px solid}
.b-ok{color:var(--ok);border-color:rgba(0,240,181,.5);background:rgba(0,240,181,.12)}
.b-pr{color:#4db2ff;border-color:rgba(34,114,255,.6);background:rgba(34,114,255,.15)}
.b-dr{color:#d18bff;border-color:rgba(255,138,61,.6);background:rgba(255,138,61,.18)}
.q{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0}
.q button{padding:14px;text-align:left;font-size:13px;display:flex;flex-direction:column;gap:6px}
.mats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 14px 14px}
.mat{padding:6px;text-align:left;font-size:11px;display:block;width:100%}
.mimg{height:48px;border-radius:8px;margin-bottom:6px}
.chips{display:flex;gap:6px;padding:0 14px 10px;overflow-x:auto}
.chip{padding:4px 12px;border-radius:999px;font-size:12px;border:1px solid var(--bd);color:var(--t2);white-space:nowrap;min-height:30px}
.chip.on{background:var(--g1);color:#1A0E05;border-color:transparent}
.feat{display:flex;align-items:center;gap:16px;padding:14px 18px;flex-wrap:wrap}.fi{display:flex;gap:10px;align-items:center;flex:1;font-size:13px;min-width:120px}.fi svg{color:#FF8A3D}
.banner{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:18px 22px;font-size:13px;background:linear-gradient(90deg,rgba(122,74,34,.55),rgba(7,12,31,.9) 55%),repeating-linear-gradient(100deg,#5e3818 0 6px,#6e4420 6px 12px)}
.aic{margin-top:auto;padding:14px;display:grid;gap:8px;font-size:13px;background:radial-gradient(ellipse at 80% 0,rgba(255,138,61,.55),transparent 65%),linear-gradient(160deg,#2a1a14,#070C1F)}
.mtop,.mnav{display:none}

/* Action Sheet & Verification Modal */
.ov{position:fixed;inset:0;z-index:200;background:rgba(3,5,17,.85);display:none;place-items:center;padding:16px;backdrop-filter:blur(8px)}
.ov.show{display:grid}
.dlg{width:min(480px,100%);max-height:88vh;overflow:auto;padding:22px;border-color:var(--bd-blue)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:300;padding:10px 18px;border-radius:999px;background:#070C1F;border:1px solid var(--bd-blue);font-size:13px;opacity:0;pointer-events:none;transition:.3s}
.toast.show{opacity:1}

.sheet-backdrop{position:fixed;inset:0;background:rgba(3,5,17,.8);backdrop-filter:blur(6px);z-index:150;opacity:0;pointer-events:none;transition:opacity .32s ease}
.sheet-backdrop.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:160;background:var(--gp);border-top:1px solid var(--bd-blue);border-radius:24px 24px 0 0;padding:18px 20px calc(24px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .32s cubic-bezier(0.16,1,0.3,1);box-shadow:0 -10px 40px rgba(0,0,0,.7)}
.sheet.open{transform:translateY(0)}
.sheet-pill{width:42px;height:4px;background:rgba(255,255,255,.25);border-radius:999px;margin:0 auto 16px}
.sheet-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sheet-item{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:14px;border-radius:14px;background:rgba(3,8,24,.9);border:1px solid var(--bd);text-align:left;transition:.2s}
.sheet-item:hover{background:var(--hover);border-color:var(--bd-blue)}

.verify-table{width:100%;border-collapse:collapse;margin:12px 0;font-size:13px}
.verify-table th,.verify-table td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--bd)}
.verify-table th{color:var(--t3);font-weight:500}
.cell-warn{background:rgba(255,190,85,.18);border:1px solid rgba(255,190,85,.7);border-radius:6px;color:#FFD285;font-weight:600;padding:4px 8px;display:inline-block}
.editable-cell
