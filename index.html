<!DOCTYPE html>
<html lang="ka" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ჭკვიანი რასკროი - Smart Raskroi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans Georgian', sans-serif; -webkit-tap-highlight-color: transparent; transition: background-color 0.3s ease; }

    @keyframes rgbBorder {
      0% { border-color: #3b82f6; box-shadow: 0 0 15px rgba(59, 130, 246, 0.2); }
      33% { border-color: #10b981; box-shadow: 0 0 15px rgba(16, 185, 129, 0.2); }
      66% { border-color: #a855f7; box-shadow: 0 0 15px rgba(168, 85, 247, 0.2); }
      100% { border-color: #3b82f6; box-shadow: 0 0 15px rgba(59, 130, 246, 0.2); }
    }

    .animated-neon-card {
      animation: rgbBorder 6s infinite ease-in-out;
    }
  </style>
</head>
<body class="bg-slate-100 dark:bg-[#090D16] text-slate-800 dark:text-slate-100 min-h-screen flex justify-center items-start p-0 sm:p-4">

  <!-- მობილურის ეკრანის კონტეინერი -->
  <div id="appContainer" class="w-full max-w-md bg-white dark:bg-[#0D1322] min-h-screen sm:min-h-[844px] shadow-2xl flex flex-col justify-between sm:rounded-3xl overflow-hidden border border-slate-200 dark:border-slate-800 transition-colors duration-300">
    
    <!-- ზედა ჰედერი -->
    <header class="p-5 pt-8 border-b border-slate-100 dark:border-slate-800/80 flex items-center justify-between">
      <div>
        <span class="text-[11px] tracking-wider uppercase font-extrabold bg-purple-100 dark:bg-slate-800 text-purple-700 dark:text-cyan-400 px-2.5 py-1 rounded-md border border-purple-200 dark:border-slate-700">Smart Raskroi AI</span>
        <h1 class="text-2xl font-black tracking-tight mt-2">აირჩიეთ რეჟიმი</h1>
      </div>
      
      <!-- მარჯვენა მხარე: მუქი/ღია რეჟიმის გადამრთველი და ლოგო -->
      <div class="flex items-center gap-2">
        <button onclick="toggleTheme()" class="w-10 h-10 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 flex items-center justify-center text-lg shadow-sm hover:scale-105 transition-transform" title="თემის შეცვლა">
          <span id="themeIcon">🌙</span>
        </button>
      </div>
    </header>

    <!-- მთავარი სამუშაო სივრცე: რეჟიმების არჩევანი -->
    <main class="p-5 flex-1 space-y-5 flex flex-col justify-center">

      <!-- ბარათი 1: ხელოსანი / საამქრო -->
      <div onclick="selectMode('workshop')" class="group p-5 bg-gradient-to-br from-white to-purple-50/40 dark:from-[#131B31]/90 dark:to-[#0D1322] border-2 rounded-3xl cursor-pointer transition-all animated-neon-card relative overflow-hidden active:scale-98 shadow-md">
        <div class="absolute top-0 right-0 bg-gradient-to-l from-blue-600 to-emerald-500 text-white font-black text-[10px] px-3.5 py-1 rounded-bl-xl uppercase tracking-wider shadow-sm">
          ოსტატებისთვის
        </div>
        <div class="flex items-center gap-4">
          <div class="w-14 h-14 bg-purple-100 dark:bg-slate-900 text-purple-600 dark:text-emerald-400 rounded-2xl flex items-center justify-center text-3xl group-hover:scale-110 transition-transform border border-purple-200 dark:border-slate-700">
            🔨
          </div>
          <div>
            <h3 class="text-lg font-black">საამქროს რეჟიმი</h3>
            <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">სწრაფი ზომები, ფოტო სკანირება და ხმოვანი კარნახი</p>
          </div>
        </div>
      </div>

      <!-- ბარათი 2: ბიზნესი / ოფისი -->
      <div onclick="selectMode('business')" class="group p-5 bg-gradient-to-br from-white to-emerald-50/40 dark:from-[#131B31]/90 dark:to-[#0D1322] border-2 rounded-3xl cursor-pointer transition-all animated-neon-card relative overflow-hidden active:scale-98 shadow-md" style="animation-delay: -3s;">
        <div class="absolute top-0 right-0 bg-gradient-to-l from-purple-600 to-blue-500 text-white font-black text-[10px] px-3.5 py-1 rounded-bl-xl uppercase tracking-wider shadow-sm">
          ლიცენზირებული
        </div>
        <div class="flex items-center gap-4">
          <div class="w-14 h-14 bg-emerald-100 dark:bg-slate-900 text-emerald-600 dark:text-purple-400 rounded-2xl flex items-center justify-center text-3xl group-hover:scale-110 transition-transform border border-emerald-200 dark:border-slate-700">
            📊
          </div>
          <div>
            <h3 class="text-lg font-black">ბიზნესი / ოფისი</h3>
            <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">შეკვეთების არქივი, სტატუსები და ხარჯთაღრიცხვა</p>
          </div>
        </div>
      </div>

      <!-- დინამიური კონტეინერი -->
      <div id="dynamicContent" class="hidden p-4 bg-slate-50 dark:bg-[#131B31] border border-slate-200 dark:border-slate-800 rounded-2xl text-center text-xs text-slate-600 dark:text-slate-300 shadow-inner">
        <!-- აქ ჩაიტვირთება შესაბამისი სამუშაო სივრცე -->
      </div>

    </main>

    <!-- ქვედა ნავიგაცია -->
    <nav class="bg-white dark:bg-[#0D1322] border-t border-slate-100 dark:border-slate-800/80 p-3 px-6 flex justify-around items-center shadow-sm">
      <button class="flex flex-col items-center text-purple-600 dark:text-emerald-400 font-bold text-xs gap-1">
        <span class="text-xl">➕</span>
        <span>შექმნა</span>
      </button>
      <button class="flex flex-col items-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 font-bold text-xs gap-1">
        <span class="text-xl">📋</span>
        <span>არქივი</span>
      </button>
      <button class="flex flex-col items-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 font-bold text-xs gap-1">
        <span class="text-xl">⚙️</span>
        <span>პარამეტრები</span>
      </button>
    </nav>

  </div>

  <script>
    function toggleTheme() {
      const html = document.documentElement;
      const icon = document.getElementById('themeIcon');
      
      if (html.classList.contains('dark')) {
        html.classList.remove('dark');
        icon.innerText = '🌙';
      } else {
        html.classList.add('dark');
        icon.innerText = '☀️';
      }
    }

    function selectMode(mode) {
      const container = document.getElementById('dynamicContent');
      container.classList.remove('hidden');
      if(mode === 'workshop') {
        container.innerHTML = '<span class="text-purple-600 dark:text-emerald-400 font-bold">საამქროს რეჟიმი აქტიურია:</span> იხსნება სწრაფი კვეთების და სკანირების პანელი...';
      } else {
        container.innerHTML = '<span class="text-emerald-600 dark:text-purple-400 font-bold">ბიზნეს რეჟიმი აქტიურია:</span> მოწმდება აქტიური სესია და ლიცენზია...';
      }
    }
  </script>
</body>
</html>
