<!DOCTYPE html>
<html lang="ka" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ჭკვიანი რასკროი - Smart Raskroi AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { 
      font-family: 'Noto Sans Georgian', sans-serif; 
      -webkit-tap-highlight-color: transparent; 
      transition: background-color 0.3s ease, color 0.3s ease;
      overflow-x: hidden;
    }
    
    /* ფერადი მუსონური ციალის ეფექტი მთელ გვერდზე */
    @keyframes virtualAurora {
      0% { 
        border-color: #10b981; 
        box-shadow: 0 0 35px rgba(16, 185, 129, 0.4), inset 0 0 20px rgba(16, 185, 129, 0.15); 
      }
      33% { 
        border-color: #3b82f6; 
        box-shadow: 0 0 45px rgba(59, 130, 246, 0.45), inset 0 0 25px rgba(59, 130, 246, 0.2); 
      }
      66% { 
        border-color: #a855f7; 
        box-shadow: 0 0 40px rgba(168, 85, 247, 0.4), inset 0 0 20px rgba(168, 85, 247, 0.15); 
      }
      100% { 
        border-color: #10b981; 
        box-shadow: 0 0 35px rgba(16, 185, 129, 0.4), inset 0 0 20px rgba(16, 185, 129, 0.15); 
      }
    }

    .aurora-frame {
      animation: virtualAurora 7s infinite ease-in-out;
      border-width: 2px;
      border-style: solid;
    }

    /* AI სამფერი მოძრავი სხივი ლოგოზე */
    .ai-beam-logo {
      position: relative;
      overflow: hidden;
      background: #0f172a;
    }
    .ai-beam-logo::before {
      content: '';
      position: absolute;
      top: -100%;
      left: -100%;
      width: 300%;
      height: 300%;
      background: linear-gradient(
        45deg,
        transparent 35%,
        rgba(16, 185, 129, 0.9) 45%,
        rgba(59, 130, 246, 0.9) 50%,
        rgba(168, 85, 247, 0.9) 55%,
        transparent 65%
      );
      animation: aiSweep 3s infinite linear;
      mix-blend-mode: screen;
      pointer-events: none;
    }
    @keyframes aiSweep {
      0% { transform: translateX(-50%) translateY(-50%) rotate(45deg); }
      100% { transform: translateX(50%) translateY(50%) rotate(45deg); }
    }

    /* სავალდებულო ველები: შეუსაბამო წითელია, შევსებული - ფოსფორისფერი მწვანე */
    .dynamic-input {
      border: 2px solid #ef4444 !important;
      transition: all 0.25s ease;
    }
    .dynamic-input.filled {
      border: 2px solid #10b981 !important;
      box-shadow: 0 0 14px rgba(16, 185, 129, 0.25);
    }
  </style>
</head>
<body class="bg-slate-950 dark:bg-slate-950 min-h-screen flex justify-center items-center p-0 sm:p-4">

  <div id="mainCard" class="w-full max-w-md min-h-screen sm:min-h-[844px] shadow-2xl flex flex-col justify-between sm:rounded-3xl overflow-hidden aurora-frame bg-[#0D1322] text-slate-100 transition-colors duration-300">
    
    <!-- ზედა ჰედერი -->
    <header class="p-5 pt-8 border-b border-white/10 dark:border-white/10 flex items-center justify-between" id="appHeader">
      <div>
        <span class="text-[11px] tracking-wider uppercase font-extrabold bg-emerald-500/10 text-emerald-400 px-2.5 py-1 rounded-md border border-emerald-500/20">Smart Raskroi AI</span>
        <h1 id="pageTitle" class="text-2xl font-black tracking-tight mt-2 text-[#10b981]">ზომების შეტანა</h1>
        <p id="pageSubTitle" class="text-[11px] text-slate-400 font-medium mt-0.5">შეკვეთის მიცემის ფორმა / ზომების შეტანის მეთოდები</p>
      </div>
      
      <div class="flex items-center gap-2.5">
        <!-- ლოგო სამფერი მოძრავი სხივით -->
        <div class="w-11 h-11 rounded-2xl ai-beam-logo flex items-center justify-center shadow-md border border-emerald-500/30">
          <span class="text-lg font-black text-white relative z-10">AI</span>
        </div>
        
        <!-- თემის გადამრთველი ღილაკი -->
        <button type="button" onclick="toggleTheme()" class="w-10 h-10 rounded-xl bg-slate-800/80 hover:bg-slate-700 border border-slate-700 flex items-center justify-center text-lg shadow-sm transition-transform active:scale-95" title="ფონის შეცვლა">
          <span id="themeIcon">☀️</span>
        </button>
      </div>
    </header>

    <!-- მთავარი სამუშაო სივრცე -->
    <main class="p-5 flex-1 space-y-4 flex flex-col justify-center">

      <!-- ეტაპი 1: საამქრო, მასალა და ნარჩენები -->
      <div id="step1Selection" class="space-y-3.5">
        
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1.5">1. საამქრო / კომპანია (სავალდებულო)</label>
          <input type="text" id="factoryInput" placeholder="მაგ: შპს შავნაბადა, ltb..." list="factoryList" oninput="validateInput(this)" class="w-full p-3 bg-slate-900/90 text-white rounded-2xl text-sm font-bold outline-none dynamic-input form-field">
          <datalist id="factoryList">
            <option value="შპს შავნაბადა (ორთაჭალა)">
            <option value="LTB (ელითბი)">
            <option value="ჯეოლამი">
            <option value="კავკასიის ლამინატი">
          </datalist>
        </div>

        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1.5">2. მასალის ფორმატი (<span class="text-[#10b981]">მილიმეტრებში - მმ</span>)</label>
          <select id="materialSelect" onchange="checkCustomMaterial(this)" class="w-full p-3 bg-slate-900/90 text-white rounded-2xl text-sm font-bold outline-none border border-slate-700/80 mb-2 form-field">
            <option value="3660x2010" class="bg-slate-900 text-white">თურქული ლამინატი (3660 × 2010 მმ)</option>
            <option value="2800x2090" class="bg-slate-900 text-white">ავსტრიული ლამინატი (2800 × 2090 მმ)</option>
            <option value="2800x1220" class="bg-slate-900 text-white">MDF - მდფ (2800 × 1220 მმ)</option>
            <option value="2800x2090hdf" class="bg-slate-900 text-white">HDF - დევეპე (2800 × 2090 მმ)</option>
            <option value="custom" class="bg-slate-900 text-white">✏️ სხვა (საკუთარი ზომის მითითება)</option>
          </select>

          <div id="customMaterialBox" class="hidden grid grid-cols-2 gap-2">
            <input type="number" id="customWidth" placeholder="სიგრძე (მმ)" class="p-3 bg-slate-900/90 text-white rounded-xl text-xs font-bold outline-none border border-slate-700 form-field">
            <input type="number" id="customHeight" placeholder="სიგანე (მმ)" class="p-3 bg-slate-900/90 text-white rounded-xl text-xs font-bold outline-none border border-slate-700 form-field">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1.5">კრონკი (სისქე)</label>
            <select id="edgeSelect" class="w-full p-3 bg-slate-900/90 text-white rounded-2xl text-sm font-bold outline-none border border-slate-700/80 form-field">
              <option value="1mm" class="bg-slate-900 text-white">1 მმ</option>
              <option value="2mm" class="bg-slate-900 text-white">2 მმ</option>
              <option value="double" class="bg-slate-900 text-white">ორმაგი</option>
            </select>
