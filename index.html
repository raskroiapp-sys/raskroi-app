<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Smart Raskroi AI - Premium Dashboard</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Noto Sans Georgian -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    /* ცენტრალიზებული დიზაინ-სისტემა */
    :root {
      /* ფონები */
      --bg-primary: #030817;
      --bg-secondary: #050D20;
      --bg-sidebar: #050B19;
      --bg-panel: #07152B;
      --bg-card: #091A32;
      --bg-card-hover: #0D2342;

      /* ჩარჩოები (Borders) */
      --border-subtle: rgba(48, 112, 180, 0.30);
      --border-blue: rgba(0, 174, 255, 0.58);
      --border-glow: rgba(105, 72, 255, 0.65);

      /* ტექსტი */
      --text-primary: #F4F7FF;
      --text-secondary: #A8B8D8;
      --text-muted: #7185AC;

      /* ნეონის აქცენტები */
      --neon-cyan: #00E5FF;
      --neon-blue: #087BFF;
      --neon-purple: #762BFF;
      --neon-violet: #A12BFF;
      --neon-pink: #FF28C8;
      --neon-magenta: #F000FF;

      /* სტატუსები */
      --success: #00E6B8;
      --warning: #FFBE55;
      --danger: #FF557A;

      /* გრადიენტები */
      --gradient-primary: linear-gradient(115deg, #00D9FF 0%, #087BFF 30%, #762BFF 62%, #D12BFF 82%, #FF28C8 100%);
      --gradient-voice: linear-gradient(135deg, #00E5FF 0%, #176BFF 36%, #762BFF 68%, #FF28C8 100%);
      --gradient-panel: linear-gradient(145deg, rgba(10, 29, 57, 0.96) 0%, rgba(3, 10, 27, 0.98) 100%);
      
      /* ნათება (Glow) */
      --glow-cyan: 0 0 24px rgba(0, 229, 255, 0.22);
      --glow-purple: 0 0 28px rgba(118, 43, 255, 0.25);
      --glow-pink: 0 0 28px rgba(255, 40, 200, 0.20);
    }

    body {
      font-family: 'Noto Sans Georgian', sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      background-image: 
        radial-gradient(ellipse at 15% 5%, rgba(0, 102, 255, 0.12), transparent 45%),
        radial-gradient(ellipse at 85% 25%, rgba(128, 35, 255, 0.08), transparent 40%);
      background-attachment: fixed;
      -webkit-tap-highlight-color: transparent;
    }

    /* შუშის ეფექტის (Glassmorphism) პანელები */
    .glass-panel {
      background: var(--gradient-panel);
      border: 1px solid var(--border-subtle);
      border-radius: 18px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.035), 0 12px 32px rgba(0, 0, 0, 0.20);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      transition: all 0.3s ease;
    }
    .glass-panel:hover {
      border-color: var(--border-blue);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05), 0 12px 32px rgba(0, 0, 0, 0.30), var(--glow-cyan);
    }

    /* გრადიენტული ტექსტი */
    .text-gradient {
      background: var(--gradient-primary);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ანიმაციური მიკროფონის ნათება */
    .mic-pulse {
      box-shadow: 0 0 0 0 rgba(118, 43, 255, 0.5);
      animation: pulse-ring 3s infinite cubic-bezier(0.215, 0.61, 0.355, 1);
    }
    @keyframes pulse-ring {
      0% { box-shadow: 0 0 0 0 rgba(118, 43, 255, 0.5); }
      70% { box-shadow: 0 0 0 25px rgba(118, 43, 255, 0); }
      100% { box-shadow: 0 0 0 0 rgba(118, 43, 255, 0); }
    }

    /* მობილურის ქვედა ნავიგაცია */
    .mobile-bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 100;
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      align-items: center;
      padding: 10px 8px calc(10px + env(safe-area-inset-bottom));
      background: rgba(3, 8, 23, 0.94);
      border-top: 1px solid rgba(0, 174, 255, 0.24);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 10px;
      gap: 4px;
      transition: color 0.3s;
    }
    .nav-item.active {
      color: var(--neon-cyan);
    }

    .center-mic-btn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--gradient-voice);
      display: flex;
      align-items: center;
      justify-content: center;
      transform: translateY(-20px);
      box-shadow: 0 8px 24px rgba(118, 43, 255, 0.4), inset 0 2px 4px rgba(255,255,255,0.3);
      border: 2px solid rgba(255,255,255,0.1);
      color: white;
      margin: 0 auto;
    }

    /* სქროლის დიზაინი */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-primary); }
    ::-webkit-scrollbar-thumb { background: var(--border-subtle); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--border-blue); }

    @media (prefers-reduced-motion) {
      .mic-pulse { animation: none; }
    }
  </style>
</head>
