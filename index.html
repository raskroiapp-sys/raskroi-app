<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ჭკვიანი რასკროი - Smart Raskroi</title>
  <!-- Google Fonts & Tailwind CDN სწრაფი ვიზუალისთვის -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans Georgian', sans-serif; -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex justify-center items-start p-0 sm:p-4">

  <!-- მობილურის ეკრანის კონტეინერი -->
  <div class="w-full max-w-md bg-white min-h-screen sm:min-h-[844px] shadow-2xl flex flex-col justify-between sm:rounded-3xl overflow-hidden border border-slate-200">
    
    <!-- ზედა ჰედერი -->
    <header class="bg-slate-900 text-white p-5 pt-8 rounded-b-3xl shadow-md">
      <div class="flex items-center justify-between mb-4">
        <div>
          <span class="text-xs tracking-wider uppercase text-amber-400 font-bold">ხელოსნის ასისტენტი</span>
          <h1 class="text-2xl font-black tracking-tight">ახალი რასკროი</h1>
        </div>
        <!-- მომხმარებლის ავატარი / პროფილი -->
        <div class="w-11 h-11 bg-slate-800 border-2 border-amber-400/40 rounded-full flex items-center justify-center font-bold text-amber-400 shadow-inner">
          დ
        </div>
      </div>
      <p class="text-xs text-slate-400 font-medium">აირჩიეთ საამქრო და შეკვეთის შეტანის მეთოდი</p>
    </header>

    <!-- მთავარი სამუშაო სივრცე -->
    <main class="p-5 flex-1 space-y-6">

      <!-- ნაბიჯი 1: საამქროს შერჩევა -->
      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2.5">
          1. სად იჭრება შეკვეთა?
        </label>
        
        <!-- კომპანიების სწრაფი ბარათები / სია -->
        <div class="grid grid-cols-2 gap-3">
          
          <!-- საამქრო: შავნაბადა -->
          <button onclick="selectFactory(this, 'შავნაბადა')" 
                  class="factory-btn flex items-center gap-3 p-3.5 bg-slate-50 border-2 border-slate-200 rounded-2xl hover:border-amber-500 transition-all text-left shadow-sm active:scale-95">
            <div class="w-12 h-12 rounded-xl bg-slate-900 text-amber-400 flex items-center justify-center font-black text-sm shrink-0 shadow">
              შავ
            </div>
            <div>
              <h3 class="font-bold text-slate-900 text-sm leading-tight">შავნაბადა</h3>
              <span class="text-[11px] text-slate-500 block">ორთაჭალა</span>
            </div>
          </button>

          <!-- საამქრო: ემბავუდი / ჯეოფროფილი -->
          <button onclick="selectFactory(this, 'ჯეოფროფილი')" 
                  class="factory-btn flex items-center gap-3 p-3.5 bg-slate-50 border-2 border-slate-200 rounded-2xl hover:border-amber-500 transition-all text-left shadow-sm active:scale-95">
            <div class="w-12 h-12 rounded-xl bg-blue-900 text-white flex items-center justify-center font-black text-sm shrink-0 shadow">
              ჯეო
            </div>
            <div>
              <h3 class="font-bold text-slate-900 text-sm leading-tight">ჯეოფროფილი</h3>
              <span class="text-[11px] text-slate-500 block">დიღომი</span>
            </div>
          </button>

          <!-- საამქრო: სხვა / ჩამოსაშლელი -->
          <div class="col-span-2">
            <select id="factorySelect" onchange="onDropdownSelect(this)" 
                    class="w-full p-3.5 bg-slate-50 border-2 border-slate-200 rounded-2xl text-slate-700 text-sm font-semibold focus:outline-none focus:border-amber-500 transition">
              <option value="" disabled selected>ან აირჩიეთ სიიდან სხვა პარტნიორი...</option>
              <option value="კასტამონუ ცენტრი">კასტამონუ ჭრის ცენტრი (გლდანი)</option>
              <option value="აგტ ჯორჯია">AGT ჯორჯია (ისანი)</option>
              <option value="ავეჯის სახლი 1">ავეჯის მასალები (წერეთელი)</option>
            </select>
          </div>
        </div>
      </div>

      <!-- არჩეული საამქროს შეხსენება (დინამიური) -->
      <div id="selectionStatus" class="p-3 bg-amber-50 border border-amber-200 rounded-xl flex items-center gap-2 text-xs text-amber-900 font-bold">
        <span>📍 არჩეულია:</span>
        <span id="selectedFactoryName" class="text-amber-700 underline font-black">შავნაბადა</span>
      </div>

      <!-- ნაბიჯი 2: შეყვანის მეთოდი (დიდი ღილაკები) -->
      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2.5">
          2. როგორ შეგვაქვს ზომები?
        </label>

        <div class="space-y-3">

          <!-- 1. ფოტოს გადაღება (ძირითადი აქცენტი) -->
          <button class="w-full group p-4 bg-gradient-to-r from-emerald-600 to-teal-700 text-white rounded-2xl shadow-lg shadow-emerald-700/20 flex items-center justify-between transition-all active:scale-98 hover:brightness-105">
            <div class="flex items-center gap-4">
              <div class="w-14 h-14 bg-white/20 backdrop-blur rounded-xl flex items-center justify-center text-2xl">
                📸
              </div>
              <div class="text-left">
                <span class="block text-base font-extrabold tracking-tight">ფოტოს გადაღება</span>
                <span class="text-xs text-emerald-100 font-normal">ხელნაწერი ფურცლის ამოცნობა</span>
              </div>
            </div>
            <span class="text-lg opacity-60 group-hover:translate-x-1 transition-transform">➔</span>
          </button>

          <!-- 2. ხმოვანი კარნახი -->
          <button class="w-full group p-4 bg-gradient-to-r from-blue-600 to-indigo-700 text-white rounded-2xl shadow-lg shadow-blue-700/20 flex items-center justify-between transition-all active:scale-98 hover:brightness-105">
            <div class="flex items-center gap-4">
              <div class="w-14 h-14 bg-white/20 backdrop-blur rounded-xl flex items-center justify-center text-2xl">
                🎙️
              </div>
              <div class="text-left">
                <span class="block text-base font-extrabold tracking-tight">ხმით ნაკარნახევი</span>
                <span class="text-xs text-blue-100 font-normal">„74.2 55-ზე 2 ცალი, კანტით...“</span>
              </div>
            </div>
            <span class="text-lg opacity-60 group-hover:translate-x-1 transition-transform">➔</span>
          </button>

          <!-- 3. ხელით შეყვანა -->
          <button class="w-full group p-4 bg-slate-50 border-2 border-slate-200 text-slate-800 rounded-2xl flex items-center justify-between transition-all active:scale-98 hover:border-slate-400">
            <div class="flex items-center gap-4">
              <div class="w-14 h-14 bg-slate-200 rounded-xl flex items-center justify-center text-2xl text-slate-600">
                ⌨️
              </div>
              <div class="text-left">
                <span class="block text-base font-bold text-slate-900">ხელით შეყვანა ცხრილში</span>
                <span class="text-xs text-slate-500 font-normal">ზომების ჩაწერა თითით</span>
              </div>
            </div>
            <span class="text-lg text-slate-400 group-hover:translate-x-1 transition-transform">➔</span>
          </button>

        </div>
      </div>

    </main>

    <!-- ქვედა ნავიგაცია / სწრაფი გადასასვლელები -->
    <nav class="bg-white border-t border-slate-200 p-3 px-6 flex justify-around items-center">
      <button class="flex flex-col items-center text-emerald-600 font-bold text-xs gap-1">
        <span class="text-xl">➕</span>
        <span>შექმნა</span>
      </button>
      <button class="flex flex-col items-center text-slate-400 hover:text-slate-600 font-bold text-xs gap-1">
        <span class="text-xl">📋</span>
        <span>არქივი</span>
      </button>
      <button class="flex flex-col items-center text-slate-400 hover:text-slate-600 font-bold text-xs gap-1">
        <span class="text-xl">♻️</span>
        <span>ნარჩენები</span>
      </button>
    </nav>

  </div>

  <script>
    // მარტივი ლოგიკა ბარათების შერჩევისთვის
    function selectFactory(element, name) {
      document.querySelectorAll('.factory-btn').forEach(btn => {
        btn.classList.remove('border-amber-500', 'bg-amber-50/50');
        btn.classList.add('border-slate-200', 'bg-slate-50');
      });
      element.classList.remove('border-slate-200', 'bg-slate-50');
      element.classList.add('border-amber-500', 'bg-amber-50/50');
      document.getElementById('selectedFactoryName').innerText = name;
      document.getElementById('factorySelect').value = "";
    }

    function onDropdownSelect(select) {
      document.querySelectorAll('.factory-btn').forEach(btn => {
        btn.classList.remove('border-amber-500', 'bg-amber-50/50');
        btn.classList.add('border-slate-200', 'bg-slate-50');
      });
      document.getElementById('selectedFactoryName').innerText = select.value;
    }
  </script>
</body>
</html>
