
<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ჭკვიანი რასკროი - Smart Raskroi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans Georgian', sans-serif; -webkit-tap-highlight-color: transparent; }

    /* მოძრავი ნეონის შუქის ანიმაცია (RGB Flow Animation) */
    @keyframes rgbBorder {
      0% { border-color: #3b82f6; box-shadow: 0 0 20px rgba(59, 130, 246, 0.3); }
      33% { border-color: #10b981; box-shadow: 0 0 20px rgba(16, 185, 129, 0.3); }
      66% { border-color: #a855f7; box-shadow: 0 0 20px rgba(168, 85, 247, 0.3); }
      100% { border-color: #3b82f6; box-shadow: 0 0 20px rgba(59, 130, 246, 0.3); }
    }

    @keyframes rgbText {
      0% { color: #3b82f6; }
      33% { color: #10b981; }
      66% { color: #a855f7; }
      100% { color: #3b82f6; }
    }

    .animated-neon-card {
      animation: rgbBorder 6s infinite ease-in-out;
    }

    .animated-ai-title {
      animation: rgbText 6s infinite ease-in-out;
    }
  </style>
</head>
<body class="bg-[#090D16] text-slate-100 min-h-screen flex justify-center items-start p-0 sm:p-4">

  <!-- მობილურის ეკრანის კონტეინერი -->
  <div class="w-full max-w-md bg-[#0D1322] min-h-screen sm:min-h-[844px] shadow-2xl flex flex-col justify-between sm:rounded-3xl overflow-hidden border border-slate-800">
    
    <!-- ზედა ჰედერი -->
    <header class="bg-[#0D1322] text-white p-5 pt-8 border-b border-slate-800/80">
      <div class="flex items-center justify-between mb-2">
        <div>
          <span class="text-[11px] tracking-wider uppercase font-extrabold bg-slate-800 px-2.5 py-1 rounded-md border border-slate-700 animated-ai-title">Smart Raskroi AI</span>
          <h1 class="text-2xl font-black tracking-tight mt-2 text-white">აირჩიეთ რეჟიმი</h1>
        </div>
        <!-- ლოგოს ნეონ-გრადიენტული ავატარი -->
        <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-blue-500 via-emerald-400 to-purple-500 p-0.5 shadow-lg flex items-center justify-center">
          <div class="w-full h-full bg-[#0D1322] rounded-[14px] flex items-center justify-center font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-emerald-400 to-purple-400 text-sm">
            AI
          </div>
        </div>
      </div>
      <p class="text-xs text-slate-400 font-medium">სად გსურთ მუშაობის გაგრძელება?</p>
    </header>

    <!-- მთავარი სამუშაო სივრცე: რეჟიმების არჩევანი -->
    <main class="p-5 flex-1 space-y-5 flex flex-col justify-center">

      <!-- ბარათი 1: ხელოსანი / საამქრო (მოძრავი ნეონის ჩარჩოთი) -->
      <div onclick="selectMode('workshop')" class="group p-5 bg-[#131B31]/90 border-2 rounded-3xl cursor-pointer transition-all animated-neon-card relative overflow-hidden active:scale-98">
        <div class="absolute top-0 right-0 bg-gradient-to-l from-blue-600 to-emerald-500 text-white font-black text-[10px] px-3.5 py-1 rounded-bl-xl uppercase tracking-wider shadow-sm">
          ოსტატებისთვის
        </div>
        <div class="flex items-center gap-4">
          <div class="w-14 h-14 bg-slate-900 text-emerald-400 rounded-2xl flex items-center justify-center text-3xl group-hover:scale-110 transition-transform border border-slate-700">
            🔨
          </div>
          <div>
            <h3 class="text-lg font-black text-white">საამქროს რეჟიმი</h3>
            <p class="text-xs text-slate-400 mt-1">სწრაფი ზომები, ფოტო სკანირება და ხმოვანი კარნახი</p>
          </div>
        </div>
      </div>

      <!-- ბარათი 2: ბიზნესი / ოფისი (მოძრავი ნეონის ჩარჩოთი) -->
      <div onclick="selectMode('business')" class="group p-5 bg-[#131B31]/90 border-2 rounded-3xl cursor-pointer transition-all animated-neon-card relative overflow-hidden active:scale-98" style="animation-delay: -3s;">
        <div class="absolute top-0 right-0 bg-gradient-to-l from-purple-600 to-blue-500 text-white font-black text-[10px] px-3.5 py-1 rounded-bl-xl uppercase tracking-wider shadow-sm">
          ლიცენზირებული
        </div>
        <div class="flex items-center gap-4">
          <div class="w-14 h-14 bg-slate-900 text-purple-400 rounded-2xl flex items-center justify-center text-3xl group-hover:scale-110 transition-transform border border-slate-700">
            📊
          </div>
          <div>
            <h3 class="text-lg font-black text-white">ბიზნესი / ოფისი</h3>
            <p class="text-xs text-slate-400 mt-1">შეკვეთების არქივი, სტატუსები და ხარჯთაღრიცხვა</p>
          </div>
        </div>
      </div>

      <!-- დინამიური კონტეინერი -->
      <div id="dynamicContent" class="hidden p-4 bg-[#131B31] border border-slate-800 rounded-2xl text-center text-xs text-slate-300 shadow-inner">
        <!-- აქ ჩაიტვირთება შესაბამისი სამუშაო სივრცე -->
      </div>

    </main>

    <!-- ქვედა ნავიგაცია -->
    <nav class="bg-[#0D1322] border-t border-slate-800/80 p-3 px-6 flex justify-around items-center">
      <button class="flex flex-col items-center text-emerald-400 font-bold text-xs gap-1">
        <span class="text-xl">➕</span>
        <span>შექმნა</span>
      </button>
      <button class="flex flex-col items-center text-slate-500 hover:text-slate-300 font-bold text-xs gap-1">
        <span class="text-xl">📋</span>
        <span>არქივი</span>
      </button>
      <button class="flex flex-col items-center text-slate-500 hover:text-slate-300 font-bold text-xs gap-1">
        <span class="text-xl">⚙️</span>
        <span>პარამეტრები</span>
      </button>
    </nav>

  </div>

  <script>
    function selectMode(mode) {
      const container = document.getElementById('dynamicContent');
      container.classList.remove('hidden');
      if(mode === 'workshop') {
        container.innerHTML = '<span class="text-emerald-400 font-bold">საამქროს რეჟიმი აქტიურია:</span> იხსნება სწრაფი კვეთების და სკანირების პანელი...';
      } else {
        container.innerHTML = '<span class="text-purple-400 font-bold">ბიზნეს რეჟიმი აქტიურია:</span> მოწმდება აქტიური სესია და ლიცენზია...';
      }
    }
  </script>
</body>
</html>
